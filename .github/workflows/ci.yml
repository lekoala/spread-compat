name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: zip, gd, xlswriter
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHP Code Sniffer
        run: vendor/bin/phpcs --standard=phpcs.xml.dist src/

      - name: PHPStan
        run: vendor/bin/phpstan analyse src/

  core:
    name: Core / Baresheet only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, zip
          coverage: none

      - name: Composer install (no dev)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Baresheet-only smoke test
        run: php bin/smoke-test.php

  test:
    name: PHPUnit PHP ${{ matrix.php }} / PhpSpreadsheet ${{ matrix.phpss }} / OpenSpout ${{ matrix.openspout }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        # ^5.0 floats to the latest 5.x compatible with the PHP version being tested,
        # so on PHP 8.1 it silently caps at 5.8.x. ^5.9 pins down explicitly to the
        # PHP 8.2+ branch that dropped PHP 8.1 support, so it's actually exercised in CI.
        phpss: ["^1.26", "^5.0", "^5.9"]
        openspout: ["^4.24", "^5.0"]
        exclude:
          # OpenSpout v5 requires PHP >= 8.3
          - php: "8.1"
            openspout: "^5.0"
          - php: "8.2"
            openspout: "^5.0"
          # PhpSpreadsheet 1.x requires PHP < 8.5
          - php: "8.5"
            phpss: "^1.26"
          # PhpSpreadsheet 5.9 requires PHP >= 8.2
          - php: "8.1"
            phpss: "^5.9"

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, xlswriter
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Pin PhpSpreadsheet version
        run: composer update phpoffice/phpspreadsheet:${{ matrix.phpss }} --no-interaction --no-progress --prefer-dist

      - name: Pin OpenSpout version
        run: composer update openspout/openspout:${{ matrix.openspout }} --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist
